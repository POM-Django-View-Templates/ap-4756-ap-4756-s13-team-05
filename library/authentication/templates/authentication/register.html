{% extends 'base.html' %}

{% block title %}Register - Library Management System{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto my-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Create an Account</h1>
            <p class="text-slate-500 text-sm mt-1">Join our library community as a reader or librarian</p>
        </div>

        {% if error %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm mb-6 flex items-center space-x-2">
                <svg class="w-5 h-5 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-slate-700 mb-1">First name</label>
                    <input type="text" id="first_name" name="first_name" maxlength="20"
                        value="{{ form_data.first_name|default:'' }}"
                        class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                        placeholder="John">
                </div>

                <div>
                    <label for="middle_name" class="block text-sm font-medium text-slate-700 mb-1">Middle name</label>
                    <input type="text" id="middle_name" name="middle_name" maxlength="20"
                        value="{{ form_data.middle_name|default:'' }}"
                        class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                        placeholder="D.">
                </div>

                <div>
                    <label for="last_name" class="block text-sm font-medium text-slate-700 mb-1">Last name</label>
                    <input type="text" id="last_name" name="last_name" maxlength="20"
                        value="{{ form_data.last_name|default:'' }}"
                        class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                        placeholder="Doe">
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email address <span class="text-rose-500">*</span></label>
                <input type="email" id="email" name="email" required maxlength="100"
                    value="{{ form_data.email|default:'' }}"
                    class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                    placeholder="john.doe@example.com">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password <span class="text-rose-500">*</span></label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                        placeholder="••••••••">
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-1">Confirm password <span class="text-rose-500">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" required
                        class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                        placeholder="••••••••">
                </div>
            </div>

            <div>
                <label for="role" class="block text-sm font-medium text-slate-700 mb-1">Register as role:</label>
                <select id="role" name="role"
                    class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    <option value="0" {% if form_data.role == 0 %}selected{% endif %}>Reader (Ordinary Visitor)</option>
                    <option value="1" {% if form_data.role == 1 %}selected{% endif %}>Librarian (Staff / Admin)</option>
                </select>
            </div>

            <button type="submit"
                class="w-full mt-2 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg shadow-sm transition">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-500">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-indigo-600 font-semibold hover:underline">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
