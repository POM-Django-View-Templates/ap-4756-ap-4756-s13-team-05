<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
    <h1>Register</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <p>
            <label>First name:</label><br>
            <input type="text" name="first_name" value="{{ form_data.first_name|default:'' }}">
        </p>

        <p>
            <label>Last name:</label><br>
            <input type="text" name="last_name" value="{{ form_data.last_name|default:'' }}">
        </p>

        <p>
            <label>Middle name:</label><br>
            <input type="text" name="middle_name" value="{{ form_data.middle_name|default:'' }}">
        </p>

        <p>
            <label>Email:</label><br>
            <input type="email" name="email" required value="{{ form_data.email|default:'' }}">
        </p>

        <p>
            <label>Password:</label><br>
            <input type="password" name="password" required>
        </p>

        <p>
            <label>Confirm password:</label><br>
            <input type="password" name="confirm_password" required>
        </p>

        <p>
            <label>Role:</label><br>
            <select name="role">
                <option value="0" {% if form_data.role == 0 %}selected{% endif %}>Guest</option>
                <option value="1" {% if form_data.role == 1 %}selected{% endif %}>Librarian</option>
            </select>
        </p>

        <button type="submit">Register</button>
    </form>

    <p><a href="/authentication/login/">Go to login</a></p>
</body>
</html>
