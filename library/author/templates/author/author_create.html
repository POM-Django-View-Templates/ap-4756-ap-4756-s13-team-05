{% extends 'base.html' %}

{% block title %}Create Author - Library{% endblock %}

{% block content %}
<h1>Create New Author</h1>

{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <p>
        <label for="name">First Name:</label><br>
        <input type="text" id="name" name="name" maxlength="20" required value="{{ form_data.name|default:'' }}">
    </p>

    <p>
        <label for="surname">Last Name:</label><br>
        <input type="text" id="surname" name="surname" maxlength="20" required
            value="{{ form_data.surname|default:'' }}">
    </p>

    <p>
        <label for="patronymic">Middle Name (Patronymic):</label><br>
        <input type="text" id="patronymic" name="patronymic" maxlength="20" required
            value="{{ form_data.patronymic|default:'' }}">
    </p>

    <button type="submit">Save Author</button>
    <a href="{% url 'author_list' %}">Cancel</a>
</form>
{% endblock %}
