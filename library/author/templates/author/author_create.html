{% extends 'base.html' %}

{% block title %}Create Author - Library{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Add New Author</h1>
            <p class="text-slate-500 text-sm mt-1">Enter the author's details to add them to the library catalog</p>
        </div>

        {% if error %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm mb-6 flex items-center space-x-2">
                <svg class="w-5 h-5 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="name" class="block text-sm font-medium text-slate-700 mb-1">First Name <span class="text-rose-500">*</span></label>
                <input type="text" id="name" name="name" maxlength="{{ name_max_len|default:'20' }}" required
                    value="{{ form_data.name|default:'' }}"
                    class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                    placeholder="e.g. Taras">
            </div>

            <div>
                <label for="surname" class="block text-sm font-medium text-slate-700 mb-1">Last Name <span class="text-rose-500">*</span></label>
                <input type="text" id="surname" name="surname" maxlength="{{ surname_max_len|default:'20' }}" required
                    value="{{ form_data.surname|default:'' }}"
                    class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                    placeholder="e.g. Shevchenko">
            </div>

            <div>
                <label for="patronymic" class="block text-sm font-medium text-slate-700 mb-1">Middle Name (Patronymic) <span class="text-rose-500">*</span></label>
                <input type="text" id="patronymic" name="patronymic" maxlength="{{ patronymic_max_len|default:'20' }}" required
                    value="{{ form_data.patronymic|default:'' }}"
                    class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                    placeholder="e.g. Hryhorovych">
            </div>

            <div class="flex items-center space-x-3 pt-4 border-t border-slate-100">
                <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm transition">
                    Save Author
                </button>
                <a href="{% url 'author_list' %}" class="px-5 py-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
