{% extends 'base.html' %}

{% block title %}Order Book - Library{% endblock %}

{% block content %}
<h1>Order Book: {{ book.name }}</h1>

<p><strong>Description:</strong> {{ book.description|default:"No description" }}</p>

<form method="post">
    {% csrf_token %}

    <p>
        <label for="days">Borrow period (days, max 30):</label><br>
        <input type="number" id="days" name="days" value="14" min="1" max="30" required>
    </p>

    <button type="submit">Confirm Order</button>
    <a href="{% url 'book_detail' book.id %}">Cancel</a>
</form>
{% endblock %}
