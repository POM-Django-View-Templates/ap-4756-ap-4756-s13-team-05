{% extends 'base.html' %}

{% block title %}Add Book - Library{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Add New Book</h1>
            <p class="text-slate-500 text-sm mt-1">Fill in the book details and select author(s)</p>
        </div>

        {% if error %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm mb-6 flex items-center space-x-2">
                <svg class="w-5 h-5 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Book Title <span class="text-rose-500">*</span></label>
                <input type="text" id="name" name="name" maxlength="128" required
                    value="{{ form_data.name|default:'' }}"
                    class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                    placeholder="e.g. Kobzar">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Description (max 256 chars)</label>
                <textarea id="description" name="description" rows="3" maxlength="256"
                    class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                    placeholder="Brief description of the book...">{{ form_data.description|default:'' }}</textarea>
            </div>

            <div>
                <label for="count" class="block text-sm font-medium text-slate-700 mb-1">Available Copies <span class="text-rose-500">*</span></label>
                <input type="number" id="count" name="count" min="0"
                    value="{{ form_data.count|default:'10' }}"
                    class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
            </div>

            <div>
                <label for="authors" class="block text-sm font-medium text-slate-700 mb-1">Select Author(s)</label>
                <span class="text-xs text-slate-400 block mb-2">Hold Ctrl / Cmd to select multiple authors</span>
                <select id="authors" name="authors" multiple size="4"
                    class="w-full px-3.5 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    {% for author in authors %}
                        <option value="{{ author.id }}">
                            {{ author.name }} {{ author.surname }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex items-center space-x-3 pt-4 border-t border-slate-100">
                <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm transition">
                    Save Book
                </button>
                <a href="{% url 'book_list' %}" class="px-5 py-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
